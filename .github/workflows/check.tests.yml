name: check.tests

# Runs the dependency-free Node test suites on every pull request. They need
# nothing beyond the Node that ships on the hosted runner image, so there is no
# install step: `npm test` runs the suites themselves, not any dependency.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch the public leak scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: quadseven/infra-public
          ref: main
          sparse-checkout: .github/scripts/check_private_leaks.py
          sparse-checkout-cone-mode: false
          path: _leak-scanner
          persist-credentials: false
      - name: Prove the leak scanner rejects a seeded negative
        env:
          CONDUCTED_LEAK_SCANNER: ${{ github.workspace }}/_leak-scanner/.github/scripts/check_private_leaks.py
        run: python3 tools/test_leak_scan_seeded_negative.py
      - name: Syntax check the browser modules
        run: for f in js/dispatch/*.js; do node --check "$f"; done
      - name: Copper Version syntax check
        run: find copper/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Automated suites (overworld, battle, save/load, integrity)
        run: npm test
