<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1422">
<meta name="description" content="CONDUCTED: Copper Version. A train-collecting adventure where every pixel, tile and song is made in code.">
<title>Conducted: Copper Version</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a1422'/%3E%3Crect x='3' y='6' width='9' height='5' fill='%23c07a4a'/%3E%3Crect x='9' y='3' width='4' height='8' fill='%238b5230'/%3E%3Crect x='4' y='3' width='2' height='3' fill='%233a3440'/%3E%3Ccircle cx='5' cy='12' r='1.6' fill='%23f7f0dc'/%3E%3Ccircle cx='10' cy='12' r='1.6' fill='%23f7f0dc'/%3E%3C/svg%3E">
<style>
  :root { --bg: #1a1422; --bg2: #231a2e; --ink: #f7f0dc; --dim: #8a7a90; --copper: #c07a4a; --screen-bottom: 70vh; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background:
      repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.018) 22px 26px),
      radial-gradient(ellipse at 50% 35%, #2c2138 0%, var(--bg) 70%); }
  canvas#screen { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 0 0 3px #0d0a12, 0 0 0 5px #3a2a2a, 0 18px 50px rgba(0,0,0,.55); border-radius: 2px; }
  #help { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .02em; }
  #help kbd { font: 600 11px/1 ui-monospace, monospace; color: #d8c8b8; background: #2c2236; border: 1px solid #3e3048; border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; margin: 0 2px; }
  #help a { color: #c8a080; }
  html.touch #help { display: none; }

  /* on-screen controller */
  #pad { position: fixed; left: 0; right: 0; bottom: 0; top: var(--screen-bottom); pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #pad[hidden] { display: none; }
  #dpad, #pad .btn { position: absolute; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #dpad { width: 150px; height: 150px; left: 22px; top: calc(50% - 60px); }
  #dpad svg { width: 100%; height: 100%; display: block; }
  #dpad .hl { opacity: 0; transition: opacity .05s; }
  #dpad.up .hl.u, #dpad.down .hl.d, #dpad.left .hl.l, #dpad.right .hl.r { opacity: .28; }
  #pad .btn { border: 0; padding: 0; margin: 0; cursor: pointer; font: 800 20px/1 ui-sans-serif, system-ui, sans-serif; }
  #pad .ab { width: 68px; height: 68px; border-radius: 50%; color: #3b1509;
    background: radial-gradient(circle at 35% 30%, #f4b48c 0, #d9824f 45%, #a8532f 90%);
    box-shadow: 0 5px 0 #6a2e18, 0 9px 16px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.2); }
  #pad .ab.on { transform: translateY(3px); box-shadow: 0 2px 0 #6a2e18, 0 4px 8px rgba(0,0,0,.4); }
  #pad .ab[data-btn=a] { right: 22px; top: calc(50% - 70px); }
  #pad .ab[data-btn=b] { right: 104px; top: calc(50% - 26px); }
  #pad .pill { width: 70px; height: 22px; border-radius: 11px; font-size: 10px; letter-spacing: .1em; color: #b8a8c8;
    background: linear-gradient(#433a58, #2e2842); box-shadow: 0 2px 0 #14121f, 0 4px 8px rgba(0,0,0,.35); transform: rotate(-18deg); }
  #pad .pill.on { transform: rotate(-18deg) translateY(2px); box-shadow: 0 1px 0 #14121f; }
  #pad .pill[data-btn=select] { left: calc(50% - 82px); bottom: max(26px, env(safe-area-inset-bottom)); }
  #pad .pill[data-btn=start] { left: calc(50% + 10px); bottom: max(26px, env(safe-area-inset-bottom)); }
  body.landscape #pad { top: 0; }
  body.landscape #dpad { left: max(18px, env(safe-area-inset-left)); top: calc(50% - 40px); }
  body.landscape #pad .ab[data-btn=a] { right: max(18px, env(safe-area-inset-right)); top: calc(50% - 60px); }
  body.landscape #pad .ab[data-btn=b] { right: calc(max(18px, env(safe-area-inset-right)) + 80px); top: calc(50% - 10px); }
  body.landscape #pad .pill[data-btn=select] { left: max(24px, env(safe-area-inset-left)); bottom: auto; top: 18px; }
  body.landscape #pad .pill[data-btn=start] { left: auto; right: max(24px, env(safe-area-inset-right)); bottom: auto; top: 18px; }
</style>
</head>
<body>
<canvas id="screen" width="240" height="160" aria-label="Conducted game screen"></canvas>
<p id="help"><kbd>&#8593;&#8595;&#8592;&#8594;</kbd>/<kbd>WASD</kbd> move &nbsp; <kbd>Z</kbd> A &nbsp; <kbd>X</kbd> B (hold to run) &nbsp; <kbd>Enter</kbd> START &nbsp;&middot;&nbsp; every pixel and note is made in code</p>
<div id="pad" hidden>
  <div id="dpad" role="group" aria-label="Direction pad">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#0a0812" transform="translate(0 4)"><rect x="33" y="0" width="34" height="100" rx="8"/><rect x="0" y="33" width="100" height="34" rx="8"/></g>
      <g fill="#3c3450"><rect x="33" y="0" width="34" height="100" rx="8"/><rect x="0" y="33" width="100" height="34" rx="8"/></g>
      <g fill="#fff"><rect class="hl u" x="33" y="0" width="34" height="34" rx="8"/><rect class="hl d" x="33" y="66" width="34" height="34" rx="8"/><rect class="hl l" x="0" y="33" width="34" height="34" rx="8"/><rect class="hl r" x="66" y="33" width="34" height="34" rx="8"/></g>
      <circle cx="50" cy="50" r="9" fill="#2a2438"/>
      <g fill="#7a7098"><path d="M50 8l7 9H43z"/><path d="M50 92l7-9H43z"/><path d="M8 50l9-7v14z"/><path d="M92 50l-9-7v14z"/></g>
    </svg>
  </div>
  <button class="btn ab" data-btn="b" aria-label="B">B</button>
  <button class="btn ab" data-btn="a" aria-label="A">A</button>
  <button class="btn pill" data-btn="select" aria-label="Select">SELECT</button>
  <button class="btn pill" data-btn="start" aria-label="Start">START</button>
</div>

</html>
