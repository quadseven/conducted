# The lane pre-PR check: the steps CI runs (.github/workflows/check.tests.yml,
# job node-tests): a syntax check of the browser modules, then the suites.
interpreter: node
check: for f in js/dispatch/*.js; do node --check "$f" || exit 1; done && find copper/src -name '*.js' -print0 | xargs -0 -n1 node --check && npm test
