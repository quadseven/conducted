<!DOCTYPE html>
<html>
<head>
    <title>Error Test</title>
</head>
<body>
    <h1>JavaScript Error Test</h1>
    <div id="errors"></div>
    <div id="console-log"></div>

    <!-- Capture all errors and console output. js/error-capture.js holds the
         capture code so tests/error-page-escaping.test.js can drive the same
         code the page runs, instead of a copy of it. -->
    <script src="js/error-capture.js"></script>
    <script>
        ErrorCapture.install(document, console, handler => window.addEventListener('error', handler));
    </script>

    <!-- Load scripts in order -->
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/train-data.js"></script>
    <script src="js/moves.js"></script>
    <script src="js/train.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/player.js"></script>
    <script src="js/map.js"></script>
    <script src="js/world-maps.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/graphics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>

    <script>
        console.log('All scripts loaded successfully!');
        console.log('TILE_TYPES:', typeof TILE_TYPES !== 'undefined' ? 'defined' : 'undefined');
        console.log('CONSTANTS:', typeof CONSTANTS !== 'undefined' ? 'defined' : 'undefined');
        console.log('Game:', typeof Game !== 'undefined' ? 'defined' : 'undefined');
    </script>
</body>
</html>
