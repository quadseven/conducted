<!DOCTYPE html>
<html>
<head>
    <title>Error Test</title>
</head>
<body>
    <h1>JavaScript Error Test</h1>
    <div id="errors"></div>
    <div id="console-log"></div>

    <script>
        // Add one captured line to a panel. The text goes in through
        // textContent, never by pasting it into innerHTML: an error message or a
        // logged value is runtime input, and anything in it that looked like
        // markup would otherwise be run as markup instead of shown.
        function capture(panel, color, text) {
            const line = document.createElement('p');
            if (color) line.style.color = color;
            line.textContent = text;
            document.getElementById(panel).appendChild(line);
        }

        // Capture all errors
        window.addEventListener('error', (e) => {
            capture('errors', 'red', `ERROR: ${e.message} at ${e.filename}:${e.lineno}`);
            console.error('Caught error:', e);
        });

        // Override console.log to display on page
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            capture('console-log', null, args.join(' '));
        };

        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            capture('errors', 'red', 'CONSOLE ERROR: ' + args.join(' '));
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            capture('errors', 'orange', 'WARNING: ' + args.join(' '));
        };
    </script>

    <!-- Load scripts in order -->
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/train-data.js"></script>
    <script src="js/moves.js"></script>
    <script src="js/train.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/player.js"></script>
    <script src="js/map.js"></script>
    <script src="js/world-maps.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/graphics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>

    <script>
        console.log('All scripts loaded successfully!');
        console.log('TILE_TYPES:', typeof TILE_TYPES !== 'undefined' ? 'defined' : 'undefined');
        console.log('CONSTANTS:', typeof CONSTANTS !== 'undefined' ? 'defined' : 'undefined');
        console.log('Game:', typeof Game !== 'undefined' ? 'defined' : 'undefined');
    </script>
</body>
</html>
